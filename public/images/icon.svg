<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="12" />
  
  <!-- Invoice Icon Sheet -->
  <rect x="140" y="110" width="232" height="292" rx="16" fill="#1e2a33" stroke="url(#gold-grad)" stroke-width="8" />
  
  <!-- Sheet Lines -->
  <line x1="180" y1="180" x2="332" y2="180" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
  <line x1="180" y1="230" x2="332" y2="230" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="270" x2="280" y2="270" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="310" x2="310" y2="310" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" />
  
  <!-- Gold Currency Symbol / Checkmark -->
  <path d="M 280,350 L 295,365 L 330,330" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
